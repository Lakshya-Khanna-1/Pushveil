name: Dependency security audit

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  push:
    paths: ["Cargo.toml", "Cargo.lock"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

